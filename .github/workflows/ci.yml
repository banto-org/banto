name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax (sh -n)
        run: |
          fail=0
          for f in $(git ls-files '*.sh'); do
            sh -n "$f" || { echo "FAIL: $f"; fail=1; }
          done
          exit $fail

      - name: JSON validity (jq)
        run: |
          for f in $(git ls-files '*.json'); do
            jq empty "$f"
          done

      - name: Python compile
        run: |
          for f in $(git ls-files '*.py'); do
            python3 -m py_compile "$f"
          done

      - name: YAML validity (plugin odd/schema)
        run: |
          python3 -c "
          import glob, yaml
          for p in glob.glob('plugins/banto/templates/odd/*.yaml') + glob.glob('plugins/banto/skills/*/odd.yaml') + glob.glob('plugins/banto/i18n/*/skills/*/odd.yaml'):
              yaml.safe_load(open(p))
          print('yaml OK')
          "

      - name: Unit tests (hook wiring / store resolver / scaffold guard / store-first session / safety cores / repo-ontology)
        run: |
          sh plugins/banto/scripts/test-ai-context-paths-wiring.sh
          sh plugins/banto/scripts/test-resolve-store-path.sh
          sh plugins/banto/scripts/test-scaffold-root-guard.sh
          sh plugins/banto/scripts/test-store-first-session.sh
          sh plugins/banto/scripts/test-release-guard.sh
          sh plugins/banto/scripts/test-odd-kill-switch.sh
          sh plugins/banto/scripts/test-egress-guard.sh
          sh plugins/banto/scripts/test-hook-payloads.sh
          sh plugins/banto/scripts/test-ontology.sh
          sh plugins/banto/scripts/test-i18n.sh

      - name: i18n sync (EN generated from JA canonical)
        run: |
          sh plugins/banto/scripts/i18n-sync-check.sh

      - name: i18n materialize (active skills/ + agents/ match their i18n canonical)
        run: |
          # Catches editing the materialized copy (skills/) directly while forgetting the
          # canonical (i18n/ja) — a later materialize would silently revert the edit.
          sh plugins/banto/scripts/i18n-materialize-check.sh

      - name: i18n EN sanity (no corrupted / leaked-note EN files)
        run: |
          # Detects EN files that are a leaked agent / Stop-hook note or a collapsed stub instead
          # of a faithful translation — corruption that hash-based i18n-sync-check cannot see.
          sh plugins/banto/scripts/i18n-en-sanity.sh plugins/banto --strict

      - name: Runtime i18n guard (user-facing hook output respects banto-language)
        run: |
          # hook の実行時 echo 文字列は i18n materialize の対象外。ユーザーが見る生成物
          # （DASHBOARD.md 等）は言語非ハードコードであること＝banto-language を参照すること。
          grep -q 'banto-language' plugins/banto/hooks/ai-context-dashboard.sh \
            || { echo "FAIL: ai-context-dashboard.sh hardcodes labels (not i18n-aware)"; exit 1; }

      - name: Plugin audit (deterministic gates — runs on every PR = feature additions)
        run: |
          # 機能追加で必ず走る plugin-audit の機械化可能コア（綴り整合 + store layout 整合 + odd schema + dangling 参照）。
          # LLM 判定軸（routing 等）は headless CI 不可のため /plugin-audit を手動で別途回す。
          sh plugins/banto/scripts/plugin-audit-consistency.sh --strict
          sh plugins/banto/scripts/store-map-lint.sh --strict
          sh plugins/banto/scripts/plugin-audit-odd.sh plugins/banto --strict
          sh plugins/banto/scripts/plugin-audit-assets.sh plugins/banto --strict >/dev/null

      - name: Markdown links (relative targets resolve; README language-flip lint)
        run: |
          sh scripts/check-md-links.sh

      - name: Declaration sync (versions / skill counts)
        run: |
          pv=$(jq -r .version plugins/banto/.claude-plugin/plugin.json)
          mv=$(jq -r '.plugins[0].version' .claude-plugin/marketplace.json)
          mm=$(jq -r '.metadata.version' .claude-plugin/marketplace.json)
          [ "$pv" = "$mv" ] && [ "$pv" = "$mm" ] || { echo "version drift: plugin=$pv marketplace=$mv metadata=$mm"; exit 1; }
          total=$(ls plugins/banto/skills | wc -l)
          # count only exclusions that exist in THIS tree (the public export has them removed)
          pending=0
          for p in $(grep -m1 '^PLUGIN_EXCLUDE=' scripts/export-public.sh | sed 's/^PLUGIN_EXCLUDE="//;s/"$//'); do
            [ -d "plugins/banto/$p" ] && pending=$((pending+1))
          done
          expected=$((total - pending))
          grep -q "^${expected} skills / " README.md || { echo "README.md skill count != ${expected}"; exit 1; }
          grep -q "^${expected} skill / " README.ja.md || { echo "README.ja.md skill count != ${expected}"; exit 1; }
          echo "declarations OK (version=$pv, public skills=$expected)"

      - name: Brand gate (no legacy names)
        run: |
          sh scripts/check-legacy-names.sh --code
          sh scripts/check-legacy-names.sh
