# ODD Spec for ja-writing
# schema: ../../templates/odd/odd.schema.yaml

schema_version: 1
skill: ja-writing
autonomy_level: L1  # Lightweight utility (reference lookup only; writes land in the caller's deliverable)

in_scope:
  - Presenting practical patterns for Japanese document-type deliverables (reports / proposals / runbooks), Excel cells, and chat responses / PR descriptions / commit messages
  - Presenting audience-level (L1 non-technical / L2 semi-technical / L3 technical) writing examples

out_of_scope:
  - Defining the writing-ja rule itself (canonical source is `~/.claude/rules/writing-ja.md`)
  - Generating HTML documents (html-doc skill)
  - Writing in English or other languages

safety_boundaries:
  - This skill never writes files itself (it Reads references; the caller applies them to the deliverable)

kill_switch_conditions: []

approval_gates: []
