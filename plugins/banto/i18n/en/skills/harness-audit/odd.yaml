# ODD Spec for harness-audit
# schema: ../../templates/odd/odd.schema.yaml

schema_version: 1
skill: harness-audit
autonomy_level: L1  # Suggest (read-only audit, remediations are proposals. Destructive operations such as deletion require separate user confirmation)

in_scope:
  - System audit of the whole harness (ideology alignment / actual usage / freshness / install policy / Claude feature alignment)
  - read-only inspection (Read / Grep / Glob / readonly Bash commands)
  - Delegation of the dead-skill verdict to a general-purpose agent
  - "[Audit] harness-<date>.md report generation"

out_of_scope:
  - Quality scoring of a single skill (plugin-audit)
  - Generating / refactoring a new skill / plugin (plugin-dev)
  - Code quality review (Anthropic code-review)
  - Security audit (security-guidance / /security-review)
  - Destructive fixes to detected issues (skill deletion etc. follow safety.md and require separate confirmation)

safety_boundaries:
  - Write target: only reports under .ai-context/docs/
  - Bash is for readonly inspection only (jq / grep / ls / find). Mutating commands are forbidden
  - Under ~/.claude/ is read-only (referencing installed_plugins.json / payload-log)
  - Do not raw-output files containing secrets (per safety.md)

kill_switch_conditions:
  - Overwriting the same report 3 times in a row
  - When a mutating Bash command (rm / mv / git push / install) is requested

approval_gates:
  - Executing remediation actions (the audit only proposes; execution happens in another skill / self-driving, and deletion requires user confirmation)

human_oversight: The report is a proposal. The user decides whether to adopt destructive remediations (skill deletion / install changes).
