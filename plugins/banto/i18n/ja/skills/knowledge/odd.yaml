# ODD Spec for knowledge
# schema: ../../templates/odd/odd.schema.yaml

schema_version: 1
skill: knowledge
autonomy_level: L1  # 軽量ワークフロー（draft の一覧・レビュー・昇格）

in_scope:
  - "{base}/docs/knowledges/drafts/ の一覧表示とレビュー"
  - draft の正式 knowledge への昇格・破棄（ユーザー判断に基づく）

out_of_scope:
  - knowledge 本文の新規執筆（hook が誘導する draft 保存は各セッションの仕事）
  - decisions/ の管理（ai-context skill）

safety_boundaries:
  - Write は {base}/docs/knowledges/ 配下のみ
  - 破棄（削除）はユーザーの明示確認後のみ

kill_switch_conditions:
  - knowledges/ 配下以外への Write を要求された場合

approval_gates:
  - draft の削除（破棄）前
