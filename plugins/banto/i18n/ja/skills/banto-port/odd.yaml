# ODD Spec for banto-port
# schema: ../../templates/odd/odd.schema.yaml

schema_version: 1
skill: banto-port
autonomy_level: L2  # Copilot（ゲート実行は自走、allowlist 変更は提案、公開は人間ゲート）

in_scope:
  - 公開 allowlist（export-public.sh）のレビューと追記提案
  - rename / i18n / hygiene 規約の適用（移植対象のみ）
  - ゲート一式の実行（brand gate / sh -n / jq / unit tests）
  - export-public.sh による公開ツリー生成
  - export ツリーへの NDA 走査（registry + 手動パターン）
  - clean-room コンテナテストの実行

out_of_scope:
  - 公開リポジトリの作成・commit・push（owner の手動ゲート）
  - skill の品質採点（plugin-audit）/ システム監査（harness-audit）
  - 非公開 skill / 内部 artifact の公開化

safety_boundaries:
  - export 先は新規ディレクトリのみ（既存ディレクトリへの上書き禁止 — script 側でも拒否）
  - allowlist は default-deny を維持（追加は 1 件ずつテキスト提示）
  - 失敗ゲートの skip 禁止（FAIL → 修正 → 同ステップ再実行）

kill_switch_conditions:
  - 同一ゲートが 3 回連続 FAIL
  - NDA 走査でレジストリ名がヒット（修正せず続行しようとしたとき）
  - export 内での git commit / push 試行

approval_gates:
  - dirty working tree からの移植（先に commit するか確認）
  - allowlist への新規エントリ追加
  - 公開（export の commit / push / repo 作成）— 常に人間が実行

metrics:
  time_budget_seconds: 1200
