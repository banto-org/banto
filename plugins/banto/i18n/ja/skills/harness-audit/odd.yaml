# ODD Spec for harness-audit
# schema: ../../templates/odd/odd.schema.yaml

schema_version: 1
skill: harness-audit
autonomy_level: L1  # Suggest（read-only 監査、是正は提案。削除等の破壊操作は別途ユーザー確認）

in_scope:
  - ハーネス全体のシステム監査（思想整合 / 呼び出し実態 / 最新化 / インストール方針 / Claude 機能整合）
  - read-only 検査（Read / Grep / Glob / Bash の readonly コマンド）
  - 死蔵 skill 判定の general-purpose agent 委譲
  - "[Audit] harness-<date>.md レポート生成"

out_of_scope:
  - 単一 skill の品質スコアリング（plugin-audit）
  - 新規 skill / plugin の生成・改修（plugin-dev）
  - コード品質レビュー（Anthropic code-review）
  - セキュリティ監査（security-guidance / /security-review）
  - 検出した問題の破壊的修正（skill 削除等は safety.md に従い別途確認）

safety_boundaries:
  - 書き込み先: .ai-context/docs/ 配下のレポートのみ
  - Bash は readonly 検査のみ（jq / grep / ls / find）。変更系コマンド禁止
  - ~/.claude/ 配下は読むだけ（installed_plugins.json / payload-log の参照）
  - シークレットを含むファイルを生出力しない（safety.md 準拠）

kill_switch_conditions:
  - 同一レポートを 3 回続けて上書き
  - Bash で変更系コマンド（rm / mv / git push / install）を要求された場合

approval_gates:
  - 是正アクションの「実行」（監査は提案まで。実行は別 skill / 自走で、削除はユーザー確認）

human_oversight: レポートは提案。破壊的是正（skill 削除 / install 変更）はユーザーが採否を決める。
