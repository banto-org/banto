# ODD Spec for ai-context
# schema: ../../templates/odd/odd.schema.yaml

schema_version: 1
skill: ai-context
autonomy_level: L1  # Suggest（サブコマンド init/sort/ignore は書き込みあり、対話承認）

in_scope:
  - サブコマンド router (init / status / doctor / sort / sort project / next / phase-done / ignore / tasks split)
  - 決定ログ保存 (.ai-context/decisions/)
  - チェックポイント保存 (.ai-context/sessions/)
  - active.md 編集 + Phase 単位分割
  - 次タスクナビ（next、v5.16.0 で sdd-core 統合）
  - Phase 完了チェック + アーカイブ（phase-done、v5.16.0 で phase-done skill 統合）
  - プロジェクト全体ドキュメント整理（sort project、v5.16.0 で doc-sort 統合）
  - scaffold 抑止パス管理 (~/.claude/banto-ignore)

out_of_scope:
  - 内部検索（search skill）
  - workspace 切替（ws skill）

safety_boundaries:
  - "書き込み先: .ai-context/ 配下のみ（例外: ~/.claude/banto-ignore は ignore サブコマンド限定）"
  - decisions/ ファイルは append-only 原則（既存は破壊しない）
  - サブコマンド未指定なら使い方表示のみ（書き込みなし）
  - combined.txt 再生成は hook 任せ（手動実行しない）

kill_switch_conditions:
  - sort サブコマンドで 50 ファイル超を一括移動しようとする場合
  - decisions/ の既存ファイルを 3 件以上上書きしようとする場合
  - ~/.claude/banto-ignore に project root を追加する場合

approval_gates:
  - sort サブコマンドの実移動操作
  - ignore サブコマンドでのパス追加
  - active.md の Phase 単位分割の確定
