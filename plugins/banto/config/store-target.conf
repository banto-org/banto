# ai-context central store target (single source of truth)
#
# Design: .ai-context/decisions/2026-05-30_002_ai-context-store-org-locked-target_*.md
#
# This file ships with the plugin and is distributed to the whole team.
# init / clone / nightly-push / resolver all read this constant only.
# There is deliberately NO per-PC env override: locking the value here prevents
# anyone from silently re-pointing where team knowledge gets pushed (leak prevention).
#
# Setup (required before using the central store):
#   - Easiest: let the first-session bootstrap ask, or run
#       sh ai-context-store-init.sh --org <your-github-org-or-username>
#     The chosen org is saved to the user-scope ~/.claude/banto-store-target.conf, so later
#     projects reuse it and only confirm creation (survives `claude plugin update`).
#   - Or set AI_CONTEXT_STORE_ORG below directly (this bundled file is the fallback default).
#   - For team distribution, pin the value in your fork / private overlay; members'
#     edits to THIS file are reverted by `claude plugin update`, so prefer the user-scope conf.
#   - The repo name `ai-context-store` is generic and usually needs no change.
#
# When empty (and no user-scope conf), store init aborts with instructions
# (local-only .ai-context keeps working).

# Target GitHub org or username (REQUIRED for central store; set in your fork/overlay)
AI_CONTEXT_STORE_ORG=""

# Store repository name (generic; usually no change needed)
AI_CONTEXT_STORE_REPO="ai-context-store"

# Local clone location (default; can be overridden with AI_CONTEXT_STORE_LOCAL env)
AI_CONTEXT_STORE_LOCAL_DEFAULT="$HOME/ai-context-store"
