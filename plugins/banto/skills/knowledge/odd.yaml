# ODD Spec for knowledge
# schema: ../../templates/odd/odd.schema.yaml

schema_version: 1
skill: knowledge
autonomy_level: L1  # lightweight workflow (listing, reviewing, and promoting drafts)

in_scope:
  - "Listing and reviewing {base}/docs/knowledges/drafts/"
  - Promoting or discarding a draft into formal knowledge (based on user judgment)

out_of_scope:
  - Authoring knowledge content from scratch (hook-guided draft saving is each session's job)
  - Managing decisions/ (ai-context skill)

safety_boundaries:
  - Write only under {base}/docs/knowledges/
  - Discarding (deletion) only after explicit user confirmation

kill_switch_conditions:
  - When asked to Write outside knowledges/

approval_gates:
  - Before discarding (deleting) a draft
