# ODD Spec for ws
# schema: ../../templates/odd/odd.schema.yaml

schema_version: 1
skill: ws
autonomy_level: L2  # Copilot baseline. Per operation: done/sync=L3 (auto-execute, report only) / epic/task=L2 (proposal with adopted interpretation) / ship=human gate (PR confirmation) / switch/multi=L1
# Promotion condition: observe the misfire rate of epic proposals via telemetry and, if low, promote to L3 (decisions/2026-06-10_intent-first)

in_scope:
  - workspace list / switch / create / archive / multi / import (existing features, backward compatible)
  - Driving the 3-tier branch operation via intent detection (main ← epic ← task worktree)
  - "orchestration of git town hack / append / merge / sync / propose (plain git fallback when git-town is not installed)"
  - Physical separation of the task worktree (git worktree add) and cleanup on completion
  - WORKSPACE pointer editing + branch auto-switch

out_of_scope:
  - Executing the PR merge (humans merge. safety rule)
  - Direct push to main (blocked by odd-kill-switch)
  - Auto-resolution of sync conflicts (report and leave it to human judgment)
  - Editing individual files inside a workspace (direct Edit)
  - .ai-context/decisions/ management (ai-context skill)

safety_boundaries:
  - switch / epic / task abort if there are uncommitted changes (default)
  - Parent-branch verification is mandatory before the done merge (whether git-town-branch.<task>.parent is the intended epic)
  - worktree remove does not force when uncommitted changes remain (report only)
  - In multi mode only one primary is the write target, the rest are read-only
  - Parallel worktrees have a practical ceiling of 4-8 (excess is visualized by the fleet dashboard and odd-parallel-track)

kill_switch_conditions:
  - Requesting an operation that forcibly ignores uncommitted changes 3 times in a row in switch / done
  - The done parent verification detects an unintended parent (main, etc.)
  - A sync conflict is detected (stop without auto-resolving)
  - import detects 3 or more conflicting files

approval_gates:
  - Just before ship (creating the PR for epic → main) — the only human gate
  - When proposing a new epic (proceed by disclosing the adopted interpretation. roll back if explicitly rejected)
  - Before executing archive
  - When import has conflicts with existing files
