# ODD Spec for ai-context
# schema: ../../templates/odd/odd.schema.yaml

schema_version: 1
skill: ai-context
autonomy_level: L1  # Suggest (the bootstrap/sort/ignore/memo/knowledge subcommands write, with interactive approval)

in_scope:
  - subcommand router (bootstrap / local / doctor / sort / sort project / next / phase-done / ignore / tasks split / memo / knowledge)
  - decision-log storage ({base}/decisions/)
  - checkpoint storage ({base}/sessions/)
  - tasks.md editing + per-Phase splitting
  - next-task navigation (next; merged into sdd-core in v5.16.0)
  - Phase completion check + archiving (phase-done; merged the phase-done skill in v5.16.0)
  - project-wide document organization (sort project; merged doc-sort in v5.16.0)
  - memo creation (memo; absorbed the memo skill in 0.1.4. [Memo] documents under {base}/docs/)
  - knowledge promotion (knowledge; absorbed the knowledge skill in 0.1.4. Listing drafts, promoting, and creating new entries under {base}/docs/knowledges/)
  - store bootstrap / local pinning / health diagnostics (bootstrap / local / doctor. status is merged into doctor; init is absorbed into bootstrap; prune is automated by a hook)
  - scaffold-suppression path management (~/.claude/banto-ignore)

out_of_scope:
  - internal search (search skill)
  - workspace switching (ws skill)
  - session-state saving (save-checkpoint skill)

safety_boundaries:
  - "Write targets: only under {base}/ (exceptions: ~/.claude/banto-ignore is limited to the ignore subcommand / the store-init CLI updates mapping and conf)"
  - decisions/ files follow an append-only principle (existing files are never destroyed)
  - with no subcommand specified, only usage is shown (no writes)
  - full-combined.txt regeneration is left to the hook (never run it manually)
  - bootstrap / local delegate to the store-init CLI (GitHub creation is fixed to private; locally pinned repos are never pushed to GitHub)

kill_switch_conditions:
  - when the sort subcommand attempts to bulk-move more than 50 files at once
  - when attempting to overwrite 3 or more existing files in decisions/
  - when adding a project root to ~/.claude/banto-ignore

approval_gates:
  - the actual move operation of the sort subcommand
  - adding a path via the ignore subcommand
  - confirming a per-Phase split of tasks.md
