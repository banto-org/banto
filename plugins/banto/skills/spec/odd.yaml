# ODD Spec for spec (formerly design-first, renamed in v5.20.0)
# schema: ../../templates/odd/odd.schema.yaml

schema_version: 1
skill: spec
autonomy_level: L1  # Suggest (generates the spec, selects the template + dialogue at goal forks)

in_scope:
  - Interactive selection among 6 industry-standard templates (Spec Kit / PRD / Design Doc / RFC / ADR / Scope Doc)
  - Write the spec to {base}/docs/specs/
  - Disclose the adopted-interpretation report
  - Delegate to the architect subagent (more than 5 files or spanning multiple modules)

out_of_scope:
  - Both design and implementation (autonomously implementing right after the spec)
  - Minor fixes with no goal fork (proceed with an adopted interpretation)
  - Detailed edits to an existing spec (edit it directly)

safety_boundaries:
  - "Write target: only under {base}/docs/specs/"
  - No changes to the code itself (design only)
  - Only readonly operations via Bash(git:*) are permitted

kill_switch_conditions:
  - The same spec file is overwritten 3 times in a row
  - The architect subagent fails 3 times in a row
  - The spec exceeds 5000 lines (excessive bloat)

approval_gates:
  - Confirming the template type (1 of the 6)
  - When a goal fork exists (options that change the acceptance criteria, impact surface, or security)
  - Overwriting an existing {base}/docs/specs/ file
  - Before launching the architect subagent delegation
