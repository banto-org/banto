# ODD Spec for spec (formerly design-first, renamed in v5.20.0)
# schema: ../../templates/odd/odd.schema.yaml

schema_version: 1
skill: spec
autonomy_level: L1  # Suggest (spec generation, template selection + dialogue on goal forks)

in_scope:
  - Dialogue-driven selection among the 6 industry-standard templates (Spec Kit / PRD / Design Doc / RFC / ADR / Scope Doc)
  - Write the spec to .ai-context/specs/
  - Disclose the adopted-interpretation report
  - Delegation to the architect subagent (more than 5 files or spanning multiple modules)

out_of_scope:
  - Both design + implementation (self-driving implementation straight after spec)
  - Minor fixes without a goal fork (proceed with adopted interpretations)
  - Detailed editing of an existing spec (direct Edit)

safety_boundaries:
  - Write target: only under .ai-context/specs/
  - No changes to implementation code (design only)
  - Only readonly operations via Bash(git:*) are permitted

kill_switch_conditions:
  - Overwriting the same spec file 3 times in a row
  - The architect subagent failing 3 times in a row
  - Spec size exceeding 5000 lines (excessive bloat)

approval_gates:
  - Finalizing the template type (1 of 6)
  - When there is a goal fork (options that change acceptance criteria, impact surface, or security)
  - Overwriting an existing .ai-context/specs/ file
  - Before launching the architect subagent delegation
