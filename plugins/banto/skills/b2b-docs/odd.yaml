# ODD Spec for b2b-docs
# schema: ../../templates/odd/odd.schema.yaml

schema_version: 1
skill: b2b-docs
autonomy_level: L1  # Lightweight utility (reference lookup only; deliverable generation is the caller's / html-doc skill's job)

in_scope:
  - Presenting the B2B proposal/sales-deck chapter structure (conclusion → problem → impact → evidence → cost → rollout → risk)
  - Presenting the criteria for choosing HTML vs. PowerPoint (.pptx) as the output format
  - Presenting practical patterns for generating .pptx with python-pptx

out_of_scope:
  - Generating the single-page HTML document itself, built for browser viewing and print-to-PDF (html-doc skill)
  - Audience-level tone adjustment (ja-writing skill's audience-levels.md)
  - Diagram creation (diagram skill)

safety_boundaries:
  - This skill never writes files itself (it Reads references; the caller applies them to the deliverable)

kill_switch_conditions: []

approval_gates: []
